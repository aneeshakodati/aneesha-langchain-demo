[project]
name = "chinook-support"
version = "0.1.0"
description = "Chinook Records customer support agent — LangChain + LangGraph + LangSmith proof of concept"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-anthropic>=1.6",
    "langgraph-checkpoint-sqlite>=3.0",
    "langsmith>=0.11",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chinook_support*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Pydantic serializer warnings:UserWarning"]
